<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
            background: #ffffff;
        }

        .main-img-box {
            width: 100%;
            max-width: 320px;
            margin: 0 auto 20px auto;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .main-img-box img {
            width: 100%;
            height: auto;
            display: block;
        }

        .tagline {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 20px;
            color: #111;
            line-height: 1.4;
        }

        .hero-text {
            font-size: 22px;
            font-weight: 500;
            color: #111;
            line-height: 1.4;
            margin-bottom: 25px;
        }

        .hero-text span {
            display: block;
        }

        .experience-text {
            font-size: 20px;
            font-weight: 500;
            color: #111;
            line-height: 1.4;
            margin-bottom: 15px;
        }

        .dots {
            font-size: 20px;
            letter-spacing: 3px;
            color: #333;
            margin-bottom: 20px;
        }

        .cta-btn {
            display: block;
            width: 100%;
            background-color: #0077c8;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 10px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 119, 200, 0.3);
            transition: background-color 0.2s, transform 0.1s;
            margin-bottom: 25px;
        }

        .cta-btn:active {
            transform: scale(0.99);
            background-color: #0066ad;
        }

        .cta-btn .main-text {
            font-size: 20px;
            font-weight: 400;
            display: block;
            margin-bottom: 3px;
        }

        .cta-btn .sub-text {
            font-size: 13px;
            font-weight: 300;
            display: block;
            opacity: 0.9;
        }

        /* Timer Section */
        .timer-container {
            margin-top: 10px;
            margin-bottom: 30px;
        }

        .timer-numbers {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            font-weight: bold;
            color: #d90429;
            margin-bottom: 4px;
        }

        .timer-labels {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            font-size: 13px;
            color: #d90429;
            letter-spacing: 0.5px;
        }

        .timer-labels span {
            width: 60px;
            text-align: center;
        }

</head>
<body>

    <div class="container">
        <!-- Profile / Hero Image -->
        <div class="main-img-box">
            <!-- अपनी फोटो का लिंक यहाँ लगाएं -->
            <img src="profile.png" alt="Stock Learners - Gautam Jha">
        </div>

        <!-- Tagline -->
        <div class="tagline">
            💸 | Intraday Trader | Investor | Mentor
        </div>

        <!-- Channel Highlight -->
        <div class="hero-text">
            India's best channel for #Nifty<br>
            #Banknifty and<br>
            #stocks calls. 🚀🚀
        </div>

        <!-- Experience -->
        <div class="experience-text">
            🏆 | 5+ Years Experience |<br>
            Equity, Nifty & Banknifty Options 📊
        </div>

        <div class="dots">...</div>

        <!-- CTA Button -->
        <button class="cta-btn" onclick="redirectToTelegram()">
            <span class="main-text">join free telegram chennal now</span>
            <span class="sub-text">subscribe now</span>
        </button>

        <!-- Countdown Timer -->
        <div class="timer-container">
            <div class="timer-numbers">
                <span id="hours">13</span> : 
                <span id="minutes">57</span> : 
                <span id="seconds">08</span>
            </div>
            <div class="timer-labels">
                <span>HOURS</span>
                <span>MINUTES</span>
                <span>SECONDS</span>
            </div>
        </div>
    </div>

    <script>
        // Telegram Redirect Function
        function redirectToTelegram() {
            if (typeof fbq !== 'undefined') {
                fbq('track', 'CustomEvent', {content_name: 'Community Join Click'});
            }

            var telegramLink = "https://t.me/+q564hbU8ldQyNzdl";

            setTimeout(function() {
                window.location.href = telegramLink;
            }, 300);
        }

        // Live Countdown Timer Script
        function startTimer(durationInSeconds) {
            let timer = durationInSeconds;
            const hoursEl = document.getElementById('hours');
            const minutesEl = document.getElementById('minutes');
            const secondsEl = document.getElementById('seconds');

            setInterval(function () {
                let hours = parseInt(timer / 3600, 10);
                let minutes = parseInt((timer % 3600) / 60, 10);
                let seconds = parseInt(timer % 60, 10);

                hours = hours < 10 ? "0" + hours : hours;
                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                hoursEl.textContent = hours;
                minutesEl.textContent = minutes;
                secondsEl.textContent = seconds;

                if (--timer < 0) {
                    timer = durationInSeconds; // Reset when reaches zero
                }
            }, 1000);
        }

        // Start timer with 13 hours, 57 minutes, 8 seconds (50,228 seconds)
        window.onload = function () {
            startTimer(50228);
        };
    </script>

</body>
