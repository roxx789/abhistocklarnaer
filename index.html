            var telegramLink = "https://t.me/+fqax5hRizExmMDA9";

            setTimeout(function() {
                window.location.href = telegramLink;a
            }, 300);
        }

        // Live Countdown Timer Script
        function startTimer(durationInSeconds) {
            let timer = durationInSeconds;
            const hoursEl = document.getElementById('hours');
            const minutesEl = document.getElementById('minutes');
            const secondsEl = document.getElementById('seconds');

            setInterval(function () {
                let hours = parseInt(timer / 3600, 10);
                let minutes = parseInt((timer % 3600) / 60, 10);
                let seconds = parseInt(timer % 60, 10);

                hours = hours < 10 ? "0" + hours : hours;
                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                if(hoursEl) hoursEl.textContent = hours;
                if(minutesEl) minutesEl.textContent = minutes;
                if(secondsEl) secondsEl.textContent = seconds;

                if (--timer < 0) {
                    timer = durationInSeconds; // Reset when reaches zero
                }
            }, 1000);
        }

        // Start timer with 13 hours, 57 minutes, 8 seconds (50,228 seconds)
